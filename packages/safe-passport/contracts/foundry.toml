[profile.default]
solc_version = "0.8.28"
src = "src"
out = "out"
libs = ["lib", "node_modules"]
remappings = [
    "forge-std/=lib/forge-std/src/",
    "@selfxyz/contracts/=node_modules/@selfxyz/contracts/"
]

[fmt]
line_length = 100

[rpc_endpoints]
celo_sepolia = "https://forno.celo-sepolia.celo-testnet.org"

[etherscan]
celo_sepolia = { key = "${CELO_SEPOLIA_API_KEY}", url = "https://api-sepolia.celoscan.io/api" }

